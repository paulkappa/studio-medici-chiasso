<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Studio Medici Chiasso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Noto+Sans:wght@400;500;600&display=swap">
<style id="css">
/* Layout: bande a tutta larghezza alternate chiaro/scuro, contenuto a 1240px; viste a hash (home, trattamenti, scheda cura, prenota); titoli serif con corsivo d'accento; pannello di modifica fisso a destra. */
:root{--bg:#F4F9FA;--paper:#FFFFFF;--tint:#E6F3F5;--ink:#0B2530;--mute:#46606A;--line:#D5E5E9;--acc:#0E7490;--acc-d:#155E75;--deep:#062C36;--deep-l:#0C4654;--deep-x:#041F27;--on:#E6F4F6;--on-m:#A9C8CE;--hair:#1B4B57;--gold:#0D9488;--gold-l:#5EEAD4;--gold-h:#99F6E4;--aqua:#67E8F9;--ph:#DCEDF0;--danger:#B42318;--fd:"Figtree",-apple-system,"SF Pro Display",system-ui,sans-serif;--fb:"Noto Sans",-apple-system,"SF Pro Text",system-ui,sans-serif}
:root[data-pal="notte"]{--bg:#F7F8FB;--tint:#EBF0F7;--ink:#101A2B;--mute:#4B5A70;--line:#D5DEEA;--acc:#2A5596;--acc-d:#1E3F72;--deep:#0D1A2D;--deep-l:#1C3456;--deep-x:#08111E;--on:#E9EEF6;--on-m:#A9B8CF;--hair:#22385A;--gold:#9A7B4C;--gold-l:#D9C3A0;--gold-h:#E8D7BB;--aqua:#9DBDEB;--ph:#DCE3EE}
:root[data-pal="salvia"]{--bg:#F7F8F6;--tint:#EDF1EA;--ink:#1B2218;--mute:#56604F;--line:#DCE1D6;--acc:#4A6B53;--acc-d:#37523F;--deep:#1E2A22;--deep-l:#34493A;--deep-x:#141C16;--on:#EEF1EC;--on-m:#B4C2B6;--hair:#33453A;--gold:#A0673F;--gold-l:#DDA77E;--gold-h:#EBC4A5;--aqua:#B5D1BA;--ph:#E2E7DC}
:root[data-pal="grafite"]{--bg:#F7F7F7;--tint:#EEF0F2;--ink:#16191D;--mute:#555B63;--line:#DADDE1;--acc:#2F6690;--acc-d:#234E6E;--deep:#1A1D21;--deep-l:#2E343B;--deep-x:#111316;--on:#EEF0F2;--on-m:#B3B9C1;--hair:#30363E;--gold:#4F7FA3;--gold-l:#9FC7E6;--gold-h:#C2DCF0;--aqua:#9FC7E6;--ph:#E1E4E8}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--fb);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
*{box-sizing:border-box}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--fd);font-weight:500;line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(46px,6.6vw,94px)}
h2{font-size:clamp(36px,4.8vw,62px)}
h3{font-size:clamp(23px,2vw,27px);line-height:1.15}
em{font-style:italic;font-weight:400;color:var(--acc)}
a{color:var(--acc)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}
section{scroll-margin-top:84px}
.w{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.band{padding-block:clamp(72px,10vw,136px)}
.tint{background:var(--tint)}
.dk{background:var(--deep);color:var(--on)}
.dk h1,.dk h2,.dk h3{color:var(--paper)}
.dk em{color:var(--gold-l)}
.dk p{color:var(--on-m)}
.eb{display:inline-flex;align-items:center;gap:14px;font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc)}
.eb::before{content:"";width:32px;height:1px;background:currentColor;opacity:.7}
.dk .eb{color:var(--gold-l)}
.lead{color:var(--mute);font-size:clamp(16px,1.3vw,18.5px);max-width:58ch}
.small{font-size:13px;color:var(--mute)}
.sec-h{display:flex;flex-wrap:wrap;gap:20px 64px;align-items:flex-end;justify-content:space-between;margin-bottom:clamp(40px,6vw,72px)}
.sec-h>div{display:flex;flex-direction:column;gap:18px;max-width:760px;min-width:0}
.sec-h .lead{flex:0 1 420px;min-width:0}
/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font:600 14.5px var(--fb);letter-spacing:.02em;text-decoration:none;border:1px solid transparent;background:transparent;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.btn::after{content:"\2192";transition:transform .25s}
.btn:hover::after{transform:translateX(4px)}
.btn.pri{background:var(--acc);color:var(--paper)}.btn.pri:hover{background:var(--acc-d)}
.btn.gold{background:var(--gold-l);color:var(--deep)}.btn.gold:hover{background:var(--gold-h)}
.btn.line{border-color:var(--line);color:var(--ink)}.btn.line:hover{border-color:var(--acc);color:var(--acc)}
.dk .btn.line{border-color:var(--hair);color:var(--on)}.dk .btn.line:hover{border-color:var(--gold-l);color:var(--gold-l)}
.quick{display:flex;flex-wrap:wrap;gap:12px}
/* immagini e grafica sfaccettata */
.media{position:relative;overflow:hidden;background:var(--deep);max-width:100%}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.art{position:absolute;inset:0;color:var(--aqua);background:radial-gradient(120% 90% at 15% 10%,var(--deep-l) 0%,var(--deep) 62%)}
.art svg{position:absolute;inset:0;width:100%;height:100%;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.15) 48%,rgba(255,255,255,.07) 52%,transparent 65%);background-size:300% 100%;animation:shine 9s ease-in-out infinite}
@keyframes shine{0%{background-position:100% 0}60%,100%{background-position:0 0}}
/* barra e intestazione */
.top{background:var(--deep-x);color:var(--on-m);font-size:12.5px;letter-spacing:.02em}
.top-in{display:flex;flex-wrap:wrap;gap:6px 28px;justify-content:space-between;padding-block:9px}
.top-r{display:flex;flex-wrap:wrap;gap:6px 24px}
.top a{color:var(--on);text-decoration:none}
.top a.u{color:var(--gold-l);font-weight:500}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:12px 32px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand svg{width:38px;height:38px;color:var(--acc);flex:none}
.brand b{display:block;font-family:var(--fd);font-weight:600;font-size:25px;line-height:1}
.brand small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-top:5px}
.menu{display:flex;align-items:center;gap:6px 26px;font-size:14.5px;font-weight:500}
.menu a:not(.btn){color:var(--ink);text-decoration:none;padding:10px 0;position:relative}
.menu a:not(.btn)::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:1px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.menu a:not(.btn):hover::after,.menu a.cur::after{transform:scaleX(1)}
.menu .btn{min-height:44px;padding:0 20px}
.menu-t{display:none;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;font:600 14px var(--fb);color:var(--ink);cursor:pointer}
@media (max-width:1080px){
 .nav-in{flex-wrap:wrap}.menu-t{display:inline-flex}
 .menu{display:none;flex-basis:100%;flex-direction:column;align-items:stretch;gap:0;padding-bottom:10px}
 .nav.open .menu{display:flex}
 .menu a:not(.btn){padding:14px 0;border-top:1px solid var(--line)}
 .menu a:not(.btn)::after{display:none}
 .menu .btn{margin-top:12px}
}
/* hero */
.hero{position:relative;overflow:hidden}
.hero-in{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(40px,6vw,88px);align-items:center;padding-block:clamp(56px,8vw,112px) clamp(48px,6vw,80px)}
.hero-t{display:flex;flex-direction:column;gap:28px;min-width:0}
.tlinks{display:flex;flex-wrap:wrap;gap:10px 28px;font-size:14px}
.tlinks a{color:var(--on);text-decoration:none;border-bottom:1px solid var(--hair);padding-bottom:3px;overflow-wrap:anywhere}
.tlinks a:hover{color:var(--gold-l);border-color:var(--gold-l)}
.hero-v{position:relative;min-width:0}
.arch{width:100%;aspect-ratio:4/5;max-height:640px;border-radius:50% 50% 16px 16px / 38% 38% 16px 16px;box-shadow:0 40px 90px rgba(0,0,0,.35)}
.arch.sm{aspect-ratio:1/1;max-height:460px}
.float{position:absolute;left:16px;bottom:9%;background:var(--deep);background:color-mix(in srgb,var(--deep) 76%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--hair);border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:2px;max-width:calc(100% - 32px);text-decoration:none}
.float small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-m)}
.float b{font-family:var(--fd);font-size:32px;font-weight:500;color:var(--gold-l);line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));border-top:1px solid var(--hair);padding-bottom:clamp(36px,5vw,64px)}
.stat{padding:28px 20px 8px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.stat b{font-family:var(--fd);font-weight:500;font-size:clamp(38px,4vw,54px);line-height:1;color:var(--gold-l)}
.stat span{font-size:13px;color:var(--on-m);letter-spacing:.03em}
.sub-in{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(36px,6vw,80px);align-items:center;padding-block:clamp(48px,7vw,96px)}
.sub-t,.sub-one{display:flex;flex-direction:column;gap:22px;min-width:0}
.sub-one{padding-block:clamp(48px,7vw,104px)}
.sub h1{font-size:clamp(42px,5.6vw,80px)}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--on-m)}
.crumbs a{color:var(--on);text-decoration:none}.crumbs a:hover{color:var(--gold-l)}
@media (min-width:861px){.float{left:-36px}}
@media (max-width:860px){.hero-in,.sub-in{grid-template-columns:minmax(0,1fr)}.arch{aspect-ratio:1/1}}
/* team */
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:32px 22px}
.doc{display:flex;flex-direction:column;gap:18px;min-width:0}
.portrait{aspect-ratio:4/5;border-radius:18px}
.mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:clamp(60px,6vw,88px);font-weight:500;color:var(--gold-l);letter-spacing:.04em}
.doc-t{display:flex;flex-direction:column;gap:8px}
.role{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.staff{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px 48px;margin-top:56px;padding-top:32px;border-top:1px solid var(--line)}
.staff div{display:flex;flex-direction:column;gap:8px;min-width:0}
.staff span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:600}
.staff p{font-family:var(--fd);font-size:clamp(24px,2.4vw,30px);line-height:1.25}
/* schede trattamenti */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:20px}
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);transition:transform .4s,box-shadow .4s;min-width:0}
.tcard:hover{transform:translateY(-4px);box-shadow:0 24px 50px rgba(10,20,30,.12)}
.tc-img{aspect-ratio:16/10}
.tc-ico{position:absolute;left:18px;bottom:18px;width:54px;height:54px;border-radius:50%;background:var(--deep);background:color-mix(in srgb,var(--deep) 72%,transparent);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;color:var(--gold-l)}
.tc-ico svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tc-b{padding:24px 26px 26px;display:flex;flex-direction:column;gap:10px;flex:1}
.tc-b p{color:var(--mute);font-size:15px}
.more{margin-top:auto;padding-top:10px;font-size:14px;font-weight:600;color:var(--acc);display:inline-flex;gap:8px;align-items:center}
.more::after{content:"\2192";transition:transform .25s}
.tcard:hover .more::after{transform:translateX(4px)}
.all{margin-top:40px}
.doc:hover .media img,.doc:hover .art svg,.case:hover .media img,.case:hover .art svg,.tcard:hover .media img,.tcard:hover .art svg{transform:scale(1.05)}
/* scheda singolo trattamento */
.det{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(40px,7vw,100px);align-items:start}
.det-l{display:flex;flex-direction:column;gap:24px;min-width:0}
.det-l .big{font-family:var(--fd);font-size:clamp(24px,2.4vw,32px);line-height:1.35;color:var(--ink);max-width:34ch}
.det-r{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(26px,3vw,38px);display:flex;flex-direction:column;gap:16px;min-width:0}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pts li{padding:14px 0 14px 30px;border-top:1px solid var(--line);position:relative}
.pts li::before{content:"";position:absolute;left:4px;top:23px;width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg)}
/* introduzione studio */
.intro{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(40px,7vw,110px);align-items:start}
.intro-l{display:flex;flex-direction:column;gap:22px;min-width:0}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:44px 48px;min-width:0}
.val{display:flex;flex-direction:column;gap:12px;padding-top:24px;border-top:1px solid var(--line);position:relative}
.val::before{content:"";position:absolute;top:-1px;left:0;width:48px;height:1px;background:var(--gold)}
.val p{color:var(--mute);font-size:15px}
/* ambienti */
.amb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,7vw,100px);align-items:start}
.amb-l{display:flex;flex-direction:column;gap:22px;position:sticky;top:110px;min-width:0}
.wide{aspect-ratio:4/3;border-radius:18px;margin-top:14px}
.rows{min-width:0}
.row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:20px;padding:30px 0;border-top:1px solid var(--hair)}
.row:last-child{border-bottom:1px solid var(--hair)}
.row .n{font-family:var(--fd);font-size:58px;line-height:.85;color:var(--gold-l);font-weight:500}
.row .dia{display:block;width:11px;height:11px;border:1px solid var(--gold-l);transform:rotate(45deg);margin:14px 0 0 6px}
.row p{font-size:15px;margin-top:8px}
/* casi clinici */
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px}
.case{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.case .media{aspect-ratio:16/11}
.case-b{padding:26px 28px 30px;display:flex;flex-direction:column;gap:10px}
.case small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.case p{color:var(--mute);font-size:15px}
/* urgenze */
.urg-s{padding-top:clamp(72px,10vw,136px)}
.urg{border-radius:24px;padding:clamp(32px,5vw,64px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:36px 48px}
.urg-h{display:flex;flex-direction:column;gap:18px;min-width:0}
.urg h2{font-size:clamp(32px,3.6vw,46px)}
.urg .note a{color:var(--gold-l)}
.urg .col{padding-top:22px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:10px;min-width:0}
.urg small,.b-card small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l);font-weight:600}
.num{font-family:var(--fd);font-size:clamp(32px,3.4vw,46px);color:var(--paper);text-decoration:none;line-height:1.1;overflow-wrap:anywhere}
.num:hover{color:var(--gold-l)}
.urg .col p{font-size:15px}
/* dove siamo */
.where{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,7vw,100px);align-items:stretch}
.where-l{display:flex;flex-direction:column;gap:22px;min-width:0}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:26px 34px;margin-block:10px 6px}
.info div{padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.info span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:600}
.info p{color:var(--mute);font-size:14.5px}
.map{min-height:460px;border-radius:24px}
.addr{position:absolute;left:20px;right:20px;bottom:20px;background:var(--bg);background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.addr b{font-family:var(--fd);font-size:30px;font-weight:500;line-height:1.05}
.addr span{font-size:13px;color:var(--mute)}
/* domande frequenti */
.faq{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(40px,7vw,100px);align-items:start}
.faq-l{display:flex;flex-direction:column;gap:20px;min-width:0}
.faq-r{min-width:0}
.qa{border-top:1px solid var(--line)}.qa:last-child{border-bottom:1px solid var(--line)}
.qa summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;font-family:var(--fd);font-size:clamp(21px,1.8vw,25px);font-weight:500;line-height:1.2}
.qa summary::-webkit-details-marker{display:none}
.qa summary i{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);position:relative}
.qa summary i::before,.qa summary i::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:1px;background:var(--acc);transform:translate(-50%,-50%)}
.qa summary i::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .3s}
.qa[open] summary i::after{transform:translate(-50%,-50%) rotate(0)}
.qa p{color:var(--mute);padding:0 52px 24px 0;font-size:15.5px;max-width:64ch}
/* contatto */
.contact{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(40px,7vw,100px);align-items:end}
.contact-l{display:flex;flex-direction:column;gap:24px;min-width:0}
.contact h2{font-size:clamp(40px,5.6vw,78px)}
.kv{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 24px;padding:20px 0;border-top:1px solid var(--hair)}
.kv:last-child{border-bottom:1px solid var(--hair)}
.kv span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-l);font-weight:600}
.kv b{font-weight:500;color:var(--on);user-select:all;overflow-wrap:anywhere}
/* prenotazione */
.book{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr);gap:clamp(32px,5vw,64px);align-items:start}
.bform{display:flex;flex-direction:column;gap:20px;min-width:0}
.fs{border:1px solid var(--line);border-radius:18px;background:var(--paper);margin:0;padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;gap:18px;min-width:0}
.fs legend{float:left;width:100%;padding:0;display:flex;align-items:center;gap:14px;font-family:var(--fd);font-size:clamp(23px,2vw,27px);font-weight:500;line-height:1.2}
.fs legend+*{clear:both}
.stp{flex:none;width:34px;height:34px;border-radius:50%;background:var(--deep);color:var(--gold-l);font:600 14px var(--fb);display:inline-flex;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:999px;font-size:14.5px;cursor:pointer;background:var(--paper);transition:background .2s,color .2s,border-color .2s}
.chip span:hover{border-color:var(--acc)}
.chip input:checked+span{background:var(--deep);border-color:var(--deep);color:var(--paper)}
.chip input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.fi{display:flex;flex-direction:column;gap:6px;min-width:0}
.fi.full{grid-column:1/-1}
.fi label,.flab{font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--mute)}
.fi input,.fi textarea{width:100%;font:16px var(--fb);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px}
.fi textarea{resize:vertical}
.fi input:focus,.fi textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px rgba(15,110,104,.15)}
.bad input,.bad textarea,.bad .chip span{border-color:var(--danger)}
.ferr{color:var(--danger);font-size:13px;font-weight:500}
.cons{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--mute);cursor:pointer}
.cons input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--acc)}
.fsub{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center}
.b-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:110px;min-width:0}
.b-card{border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--paper)}
.b-card.dk{background:var(--deep);border-color:var(--deep)}
.b-card:not(.dk) small{color:var(--acc)}
.b-card p{font-size:14.5px;color:var(--mute)}
.b-card.dk p{color:var(--on-m)}
.b-card:not(.dk) .num{color:var(--ink)}.b-card:not(.dk) .num:hover{color:var(--acc)}
.b-card .num{font-size:30px}
.sum{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;gap:20px;min-width:0;outline:none}
.msg{white-space:pre-wrap;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--tint);color:var(--ink);border-radius:12px;padding:18px 20px;margin:0;user-select:all;overflow-wrap:anywhere}
.linkb{background:none;border:0;padding:8px 0;font:600 14px var(--fb);color:var(--acc);cursor:pointer;text-decoration:underline;align-self:flex-start}
.wa{position:fixed;z-index:35;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));min-height:48px;padding:0 18px;border-radius:999px;background:var(--acc);color:var(--paper);display:inline-flex;align-items:center;gap:8px;font:600 14px var(--fb);text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.wa svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
/* piè di pagina */
.foot{background:var(--deep-x);color:var(--on-m);font-size:14px}
.foot-g{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:36px 48px;padding-block:68px 44px}
.foot-g>div{display:flex;flex-direction:column;gap:12px;min-width:0}
.foot .brand{color:var(--paper)}.foot .brand svg{color:var(--gold-l)}.foot .brand small{color:var(--on-m)}
.foot p{max-width:38ch}
.foot h4{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-l);font-weight:600}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.foot a{color:var(--on);text-decoration:none;overflow-wrap:anywhere}.foot a:hover{color:var(--gold-l)}
.foot-b{border-top:1px solid var(--hair);padding-block:22px 90px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;font-size:13px;align-items:center}
.adm{background:none;border:0;padding:6px 0;min-height:32px;font:12px var(--fb);color:var(--on-m);opacity:.45;cursor:pointer}.adm:hover,.adm:focus-visible{opacity:1;color:var(--gold-l)}
@media (max-width:900px){.intro,.amb,.where,.contact,.faq,.det,.book{grid-template-columns:minmax(0,1fr)}.amb-l,.b-side{position:static}.urg{grid-template-columns:minmax(0,1fr)}.map{min-height:380px}.foot-g{grid-template-columns:repeat(2,minmax(0,1fr))}.foot-g>div:first-child{grid-column:1/-1}}
@media (max-width:520px){.foot-g{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:52px minmax(0,1fr)}.row .n{font-size:46px}.qa p{padding-right:0}}
/* animazione d'apertura */
.intro-a .a{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.intro-a .a2{animation-delay:.1s}.intro-a .a3{animation-delay:.2s}.intro-a .a4{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* pannello di modifica */
#fab{position:fixed;z-index:40;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--ink);color:var(--paper);font:600 14.5px var(--fb);box-shadow:0 6px 20px rgba(15,42,46,.3);cursor:pointer}
#ed{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;font-size:14px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
#ed header,#ed footer{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
#ed footer{border-bottom:0;border-top:1px solid var(--line)}
#ed header b{font-family:var(--fd);font-weight:600;font-size:23px}
#ed-body{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
#ed .hint{font-size:13px;color:var(--mute);background:var(--tint);border-radius:8px;padding:10px 12px}
#ed-state{flex:1 1 100%;color:var(--mute);font-size:13px;min-height:18px}
#ed button{font:500 14px var(--fb);min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
#ed button.pri{background:var(--acc);border-color:var(--acc);color:var(--paper)}
#ed button.sm{min-height:32px;padding:0 10px;font-size:13px}
#ed button.del{color:var(--danger)}
#ed details{border:1px solid var(--line);border-radius:10px;background:var(--paper)}
#ed summary{padding:12px 14px;font-weight:600;cursor:pointer}
#ed .sec{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}
#ed .fld{display:flex;flex-direction:column;gap:4px}
#ed label,#ed legend,#ed .lst-t{font-size:12px;font-weight:600;color:var(--mute)}
#ed input[type=text],#ed input[type=password],#ed textarea{width:100%;font:14px/1.45 var(--fb);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
#ed textarea{resize:vertical}
#ed fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:10px;display:flex;flex-direction:column;gap:10px}
#ed .lst{display:flex;flex-direction:column;gap:8px}
#ed .it{background:var(--tint);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px}
#ed .it-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#ed .it-bar span{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
#ed .thumb{height:90px;border-radius:8px;background:var(--ph);color:var(--mute);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px;font-size:12px;overflow:hidden}
#ed .thumb img{width:100%;height:100%;object-fit:cover}
#ed .img-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#ed input[type=file]{font-size:13px;max-width:100%}
#ed .pals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ed .pal{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px;min-height:68px;text-align:left}
#ed .pal.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
#ed .sw{display:flex}
#ed .sw i{width:22px;height:22px;border-radius:50%;margin-right:-6px;border:2px solid var(--paper)}
#lock{position:fixed;z-index:60;inset:0;background:rgba(6,15,20,.6);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#lock form{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px;font-size:14px}
#lock b{font-family:var(--fd);font-weight:600;font-size:26px}
#lock label{font-size:12px;font-weight:600;color:var(--mute)}
#lock input{width:100%;font:16px var(--fb);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
#lock .err{color:var(--danger);font-size:13px;min-height:18px}
#lock .acts{display:flex;gap:8px;justify-content:flex-end}
#lock button{font:500 14px var(--fb);min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
#lock button.pri{background:var(--acc);border-color:var(--acc);color:var(--paper)}
@media (min-width:900px){body.ed-open{padding-right:420px}body.ed-open #fab{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Rifacimento 2026 · UI UX Pro Max — "Medical Clean": ciano calmo + verde salute, Figtree/Noto Sans, rilievi morbidi, movimento solo con significato ===== */
:root{--r:22px;--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.4,.64,1);
 --sh:0 1px 2px rgba(6,44,54,.05),0 18px 40px -24px rgba(6,44,54,.30);--sh-h:0 2px 6px rgba(6,44,54,.06),0 34px 64px -30px rgba(6,44,54,.42)}
body{font:16.5px/1.65 var(--fb);overflow-x:hidden}
h1,h2,h3{font-family:var(--fd);font-weight:700;letter-spacing:-.035em;line-height:1.03}
h3{font-weight:650;letter-spacing:-.015em;line-height:1.22;font-size:clamp(20px,1.7vw,23px)}
h2{font-size:clamp(34px,4.4vw,58px)}
em{font-style:normal;font-weight:inherit;color:var(--acc);background:linear-gradient(transparent 68%,color-mix(in srgb,var(--gold-l) 42%,transparent) 68%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .04em}
.dk em{color:var(--gold-l);background:linear-gradient(100deg,var(--gold-l),var(--aqua));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding:0}
.eb{align-self:flex-start;gap:10px;padding:7px 14px;border-radius:999px;font-size:11.5px;letter-spacing:.16em;background:color-mix(in srgb,var(--acc) 9%,transparent)}
.eb::before{width:6px;height:6px;border-radius:50%;opacity:1}
.dk .eb{background:color-mix(in srgb,var(--gold-l) 12%,transparent)}
.lead{line-height:1.7}
.band{position:relative}
/* pulsanti */
.btn{border-radius:14px;min-height:54px;padding:0 24px;font-weight:600;transition:transform .35s var(--spring),background-color .25s,color .25s,border-color .25s,box-shadow .35s}
.btn:active{transform:scale(.96)}
.btn.pri{box-shadow:0 14px 28px -14px var(--acc)}
.btn.gold{box-shadow:0 14px 30px -16px var(--gold-l)}
@media (hover:hover){.btn.pri:hover,.btn.gold:hover{transform:translateY(-2px)}}
.btn.line{background:var(--paper)}
.dk .btn.line{background:color-mix(in srgb,#fff 4%,transparent)}
/* intestazione */
.top{font-size:12.5px}
.nav{transition:box-shadow .35s var(--ease),background-color .3s}
body.scrolled .nav{box-shadow:0 12px 32px -22px rgba(6,44,54,.45)}
.brand svg{width:42px;height:42px;padding:7px;border-radius:13px;background:var(--acc);color:#fff;box-shadow:0 10px 20px -12px var(--acc)}
.brand b{font-weight:700;font-size:21px;letter-spacing:-.02em}
.menu a:not(.btn)::after{height:2px;border-radius:2px;bottom:2px}
.menu .btn{min-height:46px;border-radius:12px}
.menu-t{border-radius:12px;min-height:46px}
#prog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:46;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--acc),var(--gold-l));pointer-events:none}
/* fasce scure con luce morbida */
.hero.dk,#contatto.dk,#ambienti.dk{background:radial-gradient(70% 60% at 88% 8%,color-mix(in srgb,var(--aqua) 16%,transparent),transparent 62%),radial-gradient(55% 50% at 0% 100%,color-mix(in srgb,var(--gold-l) 12%,transparent),transparent 62%),var(--deep)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);background-size:64px 64px;opacity:.45;-webkit-mask-image:radial-gradient(65% 60% at 72% 32%,#000,transparent);mask-image:radial-gradient(65% 60% at 72% 32%,#000,transparent);pointer-events:none}
.hero>.w{position:relative}
.hero-t{gap:26px}
.tlinks a{border-bottom-color:color-mix(in srgb,var(--on) 25%,transparent)}
.arch{border-radius:clamp(130px,19vw,260px) clamp(130px,19vw,260px) 30px 30px;box-shadow:0 50px 100px -40px rgba(0,0,0,.6),0 0 0 1px var(--hair)}
.arch.sm{border-radius:clamp(110px,16vw,220px) clamp(110px,16vw,220px) 26px 26px}
.float,.chip2{border-radius:18px;border:1px solid color-mix(in srgb,#fff 16%,transparent);background:color-mix(in srgb,var(--deep) 62%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}
.float b{font-family:var(--fd);font-weight:700;font-size:28px;letter-spacing:-.02em}
.chip2{position:absolute;right:14px;top:12%;padding:14px 18px;display:flex;align-items:center;gap:12px;max-width:calc(100% - 28px)}
.chip2 i{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--gold-l);color:var(--deep)}
.chip2 i svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip2 b{display:block;color:var(--paper);font-family:var(--fd);font-size:18px;font-weight:700;line-height:1.1}
.chip2 span{display:block;color:var(--on-m);font-size:12.5px;line-height:1.3}
@media (min-width:861px){.chip2{right:-30px}}
.stats{gap:12px;border-top:0;padding-top:8px}
.stat{padding:22px 22px 20px;border-radius:18px;border:1px solid var(--hair);background:color-mix(in srgb,#fff 3%,transparent);transition:border-color .3s,transform .4s var(--spring)}
.stat b{font-family:var(--fd);font-weight:700;letter-spacing:-.03em;background:linear-gradient(100deg,var(--gold-l),var(--aqua));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@media (hover:hover){.stat:hover{border-color:color-mix(in srgb,var(--gold-l) 45%,transparent);transform:translateY(-3px)}}
.crumbs a{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hair)}
/* grafica generativa (senza foto) */
.art{color:var(--aqua);background:linear-gradient(140deg,var(--deep-l),var(--deep))}
.art svg{opacity:.9}
.media img,.art svg{transition:transform 1.4s var(--ease)}
/* team */
.team{gap:28px 20px}
.doc{padding:10px 10px 18px;border-radius:26px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh);transition:transform .45s var(--spring),box-shadow .45s}
.doc-t{padding:0 10px}
.portrait{border-radius:20px}
.mono{font-family:var(--fd);font-weight:700;letter-spacing:-.02em;color:var(--paper)}
.mono::after{content:"";position:absolute;width:42%;aspect-ratio:1;border-radius:50%;border:1px solid color-mix(in srgb,#fff 35%,transparent)}
@media (hover:hover){.doc:hover{transform:translateY(-6px);box-shadow:var(--sh-h)}}
.staff{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:28px clamp(22px,3vw,36px);box-shadow:var(--sh)}
.staff p{font-family:var(--fd);font-weight:600;letter-spacing:-.02em;font-size:clamp(21px,2vw,26px)}
/* trattamenti */
.tgrid{gap:18px}
.tcard{border-radius:var(--r);box-shadow:var(--sh);transition:transform .45s var(--spring),box-shadow .45s,border-color .3s}
@media (hover:hover){.tcard:hover{transform:translateY(-6px);box-shadow:var(--sh-h);border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}}
.tcard:active{transform:scale(.98)}
.tc-ico{border-radius:16px;background:color-mix(in srgb,#fff 16%,transparent);border-color:color-mix(in srgb,#fff 28%,transparent);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tc-b h3{font-size:21px}
.more{color:var(--acc)}
.doc:hover .art svg,.case:hover .art svg,.tcard:hover .art svg{transform:scale(1.08) rotate(-2deg)}
/* valori */
.vals{gap:18px}
.val{padding:28px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);transition:transform .45s var(--spring),box-shadow .45s}
.val::before{top:28px;left:28px;width:34px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--gold-l))}
.val h3{margin-top:18px}
@media (hover:hover){.val:hover{transform:translateY(-4px);box-shadow:var(--sh-h)}}
/* ambienti */
.wide{border-radius:var(--r)}
.row{padding:26px 18px;border-radius:18px;border-top-color:var(--hair);transition:background-color .3s}
@media (hover:hover){.row:hover{background:color-mix(in srgb,#fff 4%,transparent)}}
.row .n{font-family:var(--fd);font-weight:700;letter-spacing:-.04em;background:linear-gradient(160deg,var(--gold-l),var(--aqua));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* casi */
.case{border-radius:var(--r);box-shadow:var(--sh);transition:transform .45s var(--spring),box-shadow .45s}
@media (hover:hover){.case:hover{transform:translateY(-6px);box-shadow:var(--sh-h)}}
/* urgenze */
.urg{border-radius:30px;background:radial-gradient(60% 80% at 100% 0%,color-mix(in srgb,var(--danger) 30%,transparent),transparent 60%),var(--deep);box-shadow:var(--sh-h);position:relative;overflow:hidden}
.urg .num{font-family:var(--fd);font-weight:700;letter-spacing:-.02em}
.urg .col{padding:22px;border:1px solid var(--hair);border-radius:18px;background:color-mix(in srgb,#fff 3%,transparent)}
/* dove */
.info div{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
.map{border-radius:30px;box-shadow:var(--sh-h)}
.addr{border-radius:18px;padding-left:64px;box-shadow:0 16px 30px -18px rgba(6,44,54,.5)}
.addr::before{content:"";position:absolute;left:20px;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--acc);box-shadow:inset 0 0 0 9px var(--acc),inset 0 0 0 30px #fff}
.addr b{font-family:var(--fd);font-weight:700;font-size:24px;letter-spacing:-.02em}
/* domande */
.faq-r{display:flex;flex-direction:column;gap:10px}
.qa,.qa:last-child{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:0 22px;transition:box-shadow .35s,border-color .3s}
.qa[open]{box-shadow:var(--sh);border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
.qa summary{font-weight:650;letter-spacing:-.01em;font-size:clamp(18px,1.5vw,20px);padding:20px 0;min-height:44px}
.qa summary i{width:36px;height:36px;border:0;background:var(--tint);transition:background-color .3s,transform .4s var(--spring)}
.qa[open] summary i{background:var(--acc);transform:rotate(180deg)}
.qa[open] summary i::before,.qa[open] summary i::after{background:#fff}
.qa[open] p{animation:rise .5s var(--ease) both}
